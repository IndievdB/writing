<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Study</title>
<meta name="description" content="Find words by meaning and sound — synonyms, alliteration, assonance, rhyme, stress pattern, texture — and hear your sentence's rhythm. No AI — pure phonology and dictionaries.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>〜</text></svg>">
<link rel="stylesheet" href="css/style.css?v=23">
</head>
<body>
<header class="site-header">
  <button id="theme-toggle" type="button" aria-label="Toggle color theme">◐</button>
</header>

<main>
  <section class="panel finder-panel">
    <div class="panel-head">
      <h2>Word finder</h2>
      <button type="button" id="finder-clear" class="finder-clear">clear</button>
    </div>
    <label for="seed-input" class="visually-hidden">Meaning</label>
    <input id="seed-input" type="text" autocomplete="off" spellcheck="false" autofocus
      placeholder="Meaning — words or phrases, comma-separated: “young man”, “big, huge”, “walk slowly, amble”">
    <p id="seed-def" class="seed-def" hidden></p>
    <div class="soundslike-row">
      <label class="sl-word-label">Sounds like
        <input id="c-slword" autocomplete="off" spellcheck="false"
          placeholder="one or more words: silver moon brick"></label>
      <div id="sl-phones" class="sl-phones" role="group" aria-label="Sounds to match"></div>
    </div>
    <div class="constraint-grid">
      <label>Rhymes with
        <input id="c-rhyme" autocomplete="off" placeholder="a word: light"></label>
      <label>Syllables
        <input id="c-syll" autocomplete="off" placeholder="2  or  1-3"></label>
      <div class="stress-cell"><span class="stress-title">Stress pattern</span>
        <div class="stress-builder" role="group" aria-label="Stress pattern">
          <button type="button" id="stress-mode" hidden>exactly</button>
          <span id="stress-chips"></span>
          <button type="button" id="stress-add" title="Add a syllable">+ syllable</button>
          <button type="button" id="stress-clear" title="Remove the last syllable" hidden>×</button>
        </div>
      </div>
      <label>Type of word
        <select id="c-type">
          <option value="">any</option>
          <option value="N">noun</option>
          <option value="V">verb</option>
          <option value="J">adjective</option>
          <option value="R">adverb</option>
        </select></label>
      <label>Texture
        <select id="c-texture">
          <option value="">any</option>
          <option value="soft">soft — flows (l, m, n, r, w)</option>
          <option value="hard">hard — punches (p, t, k, s)</option>
        </select></label>
      <label>Origin
        <select id="c-origin">
          <option value="">any</option>
          <option value="germanic">Anglo-Saxon — plain, punchy</option>
          <option value="latinate">Latinate — formal, abstract</option>
        </select></label>
      <label>Feel
        <select id="c-feel">
          <option value="">any</option>
          <option value="concrete">concrete — picture it</option>
          <option value="abstract">abstract — concept</option>
        </select></label>
      <label>Rarity
        <select id="c-rarity">
          <option value="">any</option>
          <option value="common">common</option>
          <option value="rare">rare — surprising</option>
        </select></label>
    </div>
    <p id="finder-status" class="panel-hint"></p>
    <div id="finder-results" class="finder-results" aria-live="polite"></div>
    <p id="chip-legend" class="chip-legend" hidden>The marks after each word are its syllables in
      order: <b>´</b> stressed, <b>˘</b> unstressed.</p>
    <div id="def-popup" class="def-popup" hidden></div>
  </section>

  <section class="input-card">
    <label for="text-input" class="visually-hidden">Your sentence</label>
    <textarea id="text-input" rows="4" spellcheck="true"
      placeholder="Build your sentence here…"></textarea>
    <div class="speech-row" role="group" aria-label="Read aloud">
      <button type="button" id="speak-btn" title="Read the sentence aloud">▶ Read aloud</button>
      <button type="button" id="stop-speak" title="Stop">■</button>
      <label class="visually-hidden" for="model-select">Speech model</label>
      <select id="model-select" title="Speech model — neural models download once and are cached in your browser for offline use">
        <option value="sys">device voices</option>
        <option value="k8">Kokoro neural — quality (~90 MB)</option>
        <option value="k4">Kokoro neural — light (~45 MB)</option>
      </select>
      <label class="visually-hidden" for="voice-select">Voice</label>
      <select id="voice-select"></select>
      <label class="visually-hidden" for="rate-select">Speed</label>
      <select id="rate-select">
        <option value="0.8">slow</option>
        <option value="1" selected>normal</option>
        <option value="1.2">fast</option>
      </select>
      <span id="speech-status" class="status" role="status"></span>
    </div>
    <div class="input-row">
      <span id="status" class="status" role="status">loading dictionaries…</span>
    </div>
  </section>

  <section id="results" class="results" hidden>
    <div class="panel">
      <h2>Rhythm</h2>
      <p class="panel-hint">One block per syllable — tall = stressed, short = unstressed.
        Red bars are two stresses next to each other.</p>
      <div id="rhythm-strip"></div>
    </div>

  </section>

</main>

<script type="module" src="js/main.js?v=23"></script>
</body>
</html>
